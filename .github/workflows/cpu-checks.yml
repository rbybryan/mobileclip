name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - name: Exercise the evaluator without models or data
        run: python examples/paired_bootstrap_demo.py
      - name: Test statistics and report collection
        run: python -m pytest -q tests/test_paired_bootstrap.py tests/test_collect_frame_select.py tests/test_release_environment.py
      - name: Render the reported figure
        run: python scripts/plot_reported_results.py
